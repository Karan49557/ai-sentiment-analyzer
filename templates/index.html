<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sentiment Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h2 { text-align: center; margin-top: 0; }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            box-sizing: border-box;
            height: 100px;
            margin-bottom: 20px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #6366f1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #4f46e5; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #0f172a;
            border: 1px solid #334155;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }
        .error { color: #f87171; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🧠 AI Sentiment Analyzer</h2>
        <textarea id="userInput" placeholder="Type a sentence to analyze..."></textarea>
        <button id="analyzeBtn" onclick="analyzeSentiment()">Analyze Sentiment</button>
        <div id="result"><div id="outputContent"></div></div>
    </div>

    <script>
        async function analyzeSentiment() {
            const text = document.getElementById('userInput').value.trim();
            const btn = document.getElementById('analyzeBtn');
            const resultDiv = document.getElementById('result');
            const outputContent = document.getElementById('outputContent');

            if (!text) {
                alert('Please enter a sentence.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Analyzing...';
            resultDiv.style.display = 'block';
            outputContent.innerHTML = '<p style="text-align: center; color: #94a3b8;">Processing...</p>';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Server error');

                const predictions = Array.isArray(data) ? data : (data.results || []);

                let htmlOutput = '<h4 style="margin-top:0; color:#94a3b8;">Results:</h4>';
                predictions.forEach(item => {
                    htmlOutput += `
                        <div class="result-item">
                            <span><strong>${item.label}</strong></span>
                            <span>${item.score}%</span>
                        </div>
                    `;
                });
                outputContent.innerHTML = htmlOutput;
            } catch (error) {
                outputContent.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze Sentiment';
            }
        }
    </script>
</body>
</html>
